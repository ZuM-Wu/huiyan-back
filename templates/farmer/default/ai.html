{% extends "base.html" %}
{% block title %}AI 助手 - 慧眼护农 农户端{% endblock %}
{% block head %}
<!-- AI 对话页共享样式（工具气泡/消息气泡/markdown 渲染等，全 --app-* 令牌） -->
<link rel="stylesheet" href="/static/css/ai-chat.css?v={{ config.app_version }}">
<link rel="stylesheet" href="/static/css/ai-chat-images.css?v={{ config.app_version }}">
<!-- TDesign Chat 组件库样式（本地 vendor，含 Web Components 基础样式） -->
<link rel="stylesheet" href="/static/vendor/tdesign-chat/tdesign-chat.css?v={{ config.app_version }}">
<style>
/* 农户端简化聊天布局（色值全走 --app-* 令牌，双主题自适应） */
.farmer-ai-page { display: flex; flex-direction: column; height: calc(100vh - 120px); min-height: 420px;
    background: var(--app-bg-card); border: 1px solid var(--app-border);
    border-radius: var(--app-radius-md); padding: var(--app-spacing-sm) var(--app-spacing-md); }
.farmer-ai-toolbar { display: flex; align-items: center; gap: var(--app-spacing-sm); flex-wrap: wrap;
    padding-bottom: var(--app-spacing-sm); border-bottom: 1px solid var(--app-border); }
.farmer-ai-body { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; }
</style>
{% endblock %}
{% block content %}
<div id="farmer-app" class="farmer-ai-page" v-cloak>
    <!-- 顶部工具栏：会话切换 + 新对话 + 技能（农户可见预设，无模型切换） -->
    <div class="farmer-ai-toolbar">
        <t-select v-model="conversationId" style="width: 220px;" placeholder="选择历史会话"
            clearable :disabled="isStreaming" @change="onConversationChange">
            <t-option v-for="c in conversations" :key="c.id" :value="c.id" :label="c.title || '未命名会话'"></t-option>
        </t-select>
        <t-button theme="default" variant="outline" :disabled="isStreaming" @click="newConversation">
            <t-icon name="add" slot="icon"></t-icon>新对话
        </t-button>
        <t-select v-model="skillId" style="width: 180px;" placeholder="选择技能（可选）" clearable :disabled="isStreaming">
            <t-option v-for="s in skills" :key="s.id" :value="s.id" :label="s.name"></t-option>
        </t-select>
        <t-button v-if="conversationId" theme="danger" variant="text" :disabled="isStreaming" @click="removeConversation">
            <t-icon name="delete" slot="icon"></t-icon>删除会话
        </t-button>
    </div>

    <!-- 消息流 + 发送区（自建聊天组件，与后台共用 SSE 解析） -->
    <div class="farmer-ai-body">
        <div v-if="!chatList.length && !isStreaming" class="ai-chat-welcome">
            <strong>AI 助手</strong>
            <span>可以询问天气、产区、农事相关问题</span>
        </div>
        <ai-message-list ref="messageListRef" :messages="chatList" :loading="loading">
            <template #footer>
                <ai-chat-sender v-model="senderValue" v-model:attachments="uploadedImages"
                    :loading="isStreaming" :disabled="uploadingImages"
                    placeholder="输入消息，Enter 发送..." @send="onSend" @stop="onStop">
                    <template #suffix="{ renderPresets }">
                        <component :is="renderPresets([])" />
                    </template>
                </ai-chat-sender>
            </template>
        </ai-message-list>
    </div>
</div>
{% endblock %}
{% block scripts %}
<!-- TDesign Chat 组件库（IIFE 全局产物，external vue 复用全局 Vue） -->
<script src="/static/vendor/tdesign-chat/tdesign-chat.iife.js?v={{ config.app_version }}"></script>
<!-- markdown 渲染库（IIFE，暴露全局 marked 对象） -->
<script src="/static/vendor/marked/marked.min.js?v={{ config.app_version }}"></script>
<!-- AI 对话共享工具（SSE 解析/消息段模型/事件处理） -->
<script src="/static/js/ai-chat-utils.js?v={{ config.app_version }}"></script>
<script src="/static/js/upload-limits.js?v={{ config.app_version }}"></script>
<!-- AI 对话共享 Vue 组件（ai-*-.js，注册到 HuiYanComponents，顺序：依赖在前） -->
<script src="/static/js/components/ai-chat-loading.js?v={{ config.app_version }}"></script>
<script src="/static/js/components/ai-markdown-view.js?v={{ config.app_version }}"></script>
<script src="/static/js/components/ai-reasoning-block.js?v={{ config.app_version }}"></script>
<script src="/static/js/components/ai-image-grid.js?v={{ config.app_version }}"></script>
<script src="/static/js/components/ai-tool-bubble.js?v={{ config.app_version }}"></script>
<script src="/static/js/components/ai-message-bubble.js?v={{ config.app_version }}"></script>
<script src="/static/js/components/ai-message-list.js?v={{ config.app_version }}"></script>
<script src="/static/js/components/ai-chat-sender.js?v={{ config.app_version }}"></script>
<script>
/**
 * 农户端 AI 助手页 — 简化聊天界面
 * 与后台共用统一 SSE 事件信封解析（AiChatUtils）和自建聊天组件（HuiYanComponents）；
 * 不提供模型切换，技能仅展示 audience=farmer/both 的启用预设。
 */
HuiYanFarmer.createApp({
    setup: function () {
        var ref = Vue.ref;
        var nextTick = Vue.nextTick;
        var onMounted = Vue.onMounted;
        var MessagePlugin = TDesign.MessagePlugin;
        var DialogPlugin = TDesign.DialogPlugin;
        var Utils = window.AiChatUtils;

        var conversations = ref([]);
        var conversationId = ref(null);
        var skills = ref([]);
        var skillId = ref(null);
        var chatList = ref([]);
        var messageListRef = ref(null);
        var senderValue = ref('');
        var uploadedImages = ref([]);
        var loading = ref(false);
        var isStreaming = ref(false);
        var uploadingImages = ref(false);
        var abortController = null;

        var fetchConversations = function () {
            HuiYanFarmer.request.get('/ai/conversations', { params: { page: 1, page_size: 50 } }).then(function (res) {
                conversations.value = ((res.data && res.data.data) || {}).list || [];
            }).catch(function () { /* 开关关闭时 404，静默 */ });
        };

        var fetchSkills = function () {
            HuiYanFarmer.request.get('/ai/skills').then(function (res) {
                skills.value = ((res.data && res.data.data) || {}).list || [];
            }).catch(function () { /* 静默 */ });
        };

        var newConversation = function () {
            conversationId.value = null;
            chatList.value = [];
            skillId.value = null;
            uploadedImages.value = [];
        };

        var onConversationChange = function (val) {
            if (!val) { newConversation(); return; }
            uploadedImages.value = [];
            HuiYanFarmer.request.get('/ai/conversations/' + val + '/messages', {
                params: { page: 1, page_size: 200 }
            }).then(function (res) {
                var data = (res.data && res.data.data) || {};
                chatList.value = Utils.mapHistory(data.list || []);
                scrollToBottom();
            }).catch(function () { MessagePlugin.error('加载历史消息失败'); });
        };

        var removeConversation = function () {
            if (!conversationId.value) return;
            var instance = DialogPlugin.confirm({
                header: '删除会话',
                body: '确定删除当前会话吗？',
                onConfirm: function () {
                    instance.destroy();
                    HuiYanFarmer.request.delete('/ai/conversations/' + conversationId.value).then(function () {
                        MessagePlugin.success('会话已删除');
                        newConversation();
                        fetchConversations();
                    }).catch(function () { MessagePlugin.error('删除失败'); });
                },
                onClose: function () { instance.destroy(); },
                onCancel: function () { instance.destroy(); }
            });
        };

        // rAF 节流的滚动到底部
        var _scrollRafPending = false;
        function scrollToBottom() {
            if (!messageListRef.value || _scrollRafPending) return;
            _scrollRafPending = true;
            requestAnimationFrame(function () {
                _scrollRafPending = false;
                if (messageListRef.value && messageListRef.value.scrollToBottom) {
                    messageListRef.value.scrollToBottom();
                }
            });
        }

        // SSE 事件处理上下文（传给 AiChatUtils.handleEvent）
        var chatCtx = {
            chatList: chatList,
            loading: loading,
            conversationId: conversationId,
            onMeta: function () { fetchConversations(); },
            onError: function (msg) { MessagePlugin.error(msg); },
            onScroll: function () { scrollToBottom(); }
        };

        var onSend = function (text) {
            text = (text || '').trim();
            var files = uploadedImages.value || [];
            if (isStreaming.value || uploadingImages.value || (!text && !files.length)) return;
            uploadingImages.value = !!files.length;
            var imagePromise = files.length
                ? Utils.readFilesAsDataUrls(files).then(function (imageUrls) {
                    return Utils.uploadImages(files, '/api/v1/ai/upload/image', 'farmer_token')
                        .then(function (attachments) {
                            return { imageUrls: imageUrls, attachments: attachments };
                        });
                })
                : Promise.resolve({ imageUrls: [], attachments: [] });
            imagePromise.then(function (result) {
                uploadedImages.value = [];
                var content = [];
                if (text) content.push({ type: 'text', text: text });
                result.imageUrls.forEach(function (url) {
                    content.push({ type: 'image_url', image_url: { url: url } });
                });
                sendContent(text, content, result.attachments);
            }).catch(function (e) {
                MessagePlugin.error(e.message || '图片上传失败');
            }).finally(function () {
                uploadingImages.value = false;
            });
        };

        var sendContent = function (text, content, attachments) {
            senderValue.value = '';
            var userSegments = [];
            if (attachments.length) userSegments.push({ type: 'images', items: attachments });
            userSegments.push({ type: 'markdown', data: text || '已上传图片，请分析图片内容。' });
            chatList.value.push({ role: 'user', name: '我', datetime: '', content: userSegments });
            chatList.value.push({ role: 'assistant', name: 'AI 助手', datetime: '', content: [] });
            loading.value = true;
            isStreaming.value = true;
            scrollToBottom();

            abortController = new AbortController();
            Utils.fetchSse('/api/v1/ai/chat', {
                tokenKey: 'farmer_token',
                body: {
                    conversation_id: conversationId.value || 0,
                    content: content,
                    attachments: attachments,
                    skill_id: skillId.value || 0
                },
                signal: abortController.signal,
                onEvent: function (ev) {
                    Utils.handleEvent(ev, chatCtx);
                }
            }).catch(function (e) {
                if (e.name !== 'AbortError') {
                    Utils.handleEvent({ type: 'error', data: { message: e.message || '发送失败' } }, chatCtx);
                }
            }).finally(function () {
                loading.value = false;
                isStreaming.value = false;
                abortController = null;
                fetchConversations();
            });
        };

        var onStop = function () {
            if (abortController) abortController.abort();
        };

        onMounted(function () {
            fetchConversations();
            fetchSkills();
        });

        return {
            conversations: conversations, conversationId: conversationId,
            skills: skills, skillId: skillId,
            chatList: chatList, messageListRef: messageListRef, senderValue: senderValue,
            uploadedImages: uploadedImages,
            loading: loading, isStreaming: isStreaming, uploadingImages: uploadingImages,
            newConversation: newConversation, onConversationChange: onConversationChange,
            removeConversation: removeConversation, onSend: onSend, onStop: onStop
        };
    }
});
</script>
{% endblock %}
