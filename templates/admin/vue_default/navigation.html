{% extends "base.html" %}
{% block title %}导航管理 - 慧眼护农{% endblock %}
{% block content %}
<div id="page-app" v-cloak class="navigation-page">

    <!-- 前台/后台 两 Tab -->
    <t-card class="nav-card" title="导航管理">
        <t-tabs v-model="navType" theme="normal" @change="onTabChange">
            <t-tab-panel value="frontend" label="前台导航管理"></t-tab-panel>
            <t-tab-panel value="admin" label="后台导航管理"></t-tab-panel>
        </t-tabs>

        <!-- 两栏可视编辑器：左侧可拖拽菜单树 + 右侧属性表单 -->
        <div class="nav-editor">
            <!-- 左栏：菜单列表（拖拽改排序/父级） -->
            <div class="nav-editor__left">
                <div class="nav-editor__left-head">
                    <span class="nav-editor__left-title">菜单结构</span>
                    <t-button theme="primary" @click="openCreate">新建页面</t-button>
                </div>
                <t-skeleton v-if="loading" :row-col="[6]" animation="gradient"></t-skeleton>
                <div v-else class="nav-tree">
                        <div v-for="(row, idx) in flatMenus" :key="row.node.id"
                             class="nav-tree__item"
                             :class="{ 
                                 'is-active': selectedId === row.node.id, 
                                 'is-child': row.depth > 0, 
                                 'is-drag-over-sibling': dragOverId === row.node.id && dragOverType === 'sibling',
                                 'is-drag-over-child': dragOverId === row.node.id && dragOverType === 'child'
                             }"
                             :style="{ paddingLeft: (16 + row.depth * 24) + 'px' }"
                             draggable="true"
                             @click="selectNode(row.node)"
                             @dblclick="quickToggleVisible(row.node)"
                             @dragstart="onDragStart(row, $event)"
                             @dragover.prevent="onDragOver(row, $event)"
                             @dragleave="onDragLeave(row)"
                             @drop.prevent="onDrop(row)"
                             @dragend="onDragEnd">
                            <t-icon name="move" class="nav-tree__mover"></t-icon>
                            <t-icon :name="row.node.icon || 'file'" class="nav-tree__icon"></t-icon>
                            <span class="nav-tree__text">[[ row.node.title ]]</span>
                            <t-tag v-if="row.node.visible === 0" size="small" theme="warning" variant="light" 
                                   @click.stop="quickToggleVisible(row.node)" title="双击或点击标签切换显示">隐藏</t-tag>
                        </div>
                        <div v-if="!flatMenus.length" class="nav-tree__empty">暂无菜单，点击"新建页面"添加</div>
                    </div>
            </div>

            <!-- 右栏：属性表单 -->
            <div class="nav-editor__right">
                <div v-if="!selectedId && !isCreating" class="nav-editor__placeholder">
                    请选择左侧菜单进行编辑，或点击"新建页面"
                </div>
                <t-form v-else ref="formRef" :data="formData" :rules="formRules" label-align="top">
                    <t-form-item label="页面类型" name="pageType">
                        <t-select v-model="formData.pageType" :options="pageTypeOptions" @change="onPageTypeChange"/>
                    </t-form-item>
                    <t-form-item v-if="formData.pageType === 'system' || formData.pageType === 'plugin'" label="选择页面" name="registeredKey">
                        <t-tree-select v-model="formData.registeredKey" :placeholder="formData.pageType === 'plugin' ? '请选择插件页面' : '请选择系统页面'"
                                       :data="registeredOptions" :tree-props="{ expandAll: true }" filterable @change="onRegisteredChange"/>
                    </t-form-item>
                    <!-- 自定义路由：两个子 Tab —— 选择插件公开页面 / 自己填写 URL -->
                    <template v-if="formData.pageType === 'custom'">
                        <t-form-item label="路由来源">
                            <t-radio-group v-model="customMode" variant="default-filled" @change="onCustomModeChange">
                                <t-radio-button value="plugin">插件公开页面</t-radio-button>
                                <t-radio-button value="url">自定义 URL</t-radio-button>
                            </t-radio-group>
                        </t-form-item>
                        <t-form-item v-if="customMode === 'plugin'" label="选择插件页面" name="path">
                            <t-tree-select v-model="formData.path" :data="pluginPageOptions" :tree-props="{ expandAll: true }"
                                           filterable placeholder="请选择插件公开页面" @change="onPluginPageChange"/>
                            <template #help>
                                <span class="form-help-text">从已启用插件提供的页面中选择，作为导航快捷入口（可重复添加）</span>
                            </template>
                        </t-form-item>
                        <t-form-item v-if="customMode === 'url'" label="路由地址" name="path">
                            <t-input v-model="formData.path" placeholder="如 /admin/xxx 或 https://example.com"/>
                            <template #help>
                                <span class="form-help-text">支持内部路由（/开头）或外部链接（http/https开头）</span>
                            </template>
                        </t-form-item>
                        <t-form-item v-if="customMode === 'url' && formData.path" label="打开方式" name="targetType">
                            <t-radio-group v-model="formData.targetType">
                                <t-radio value="_blank">新标签页打开</t-radio>
                                <t-radio value="iframe">内嵌 iframe 打开</t-radio>
                            </t-radio-group>
                            <template #help>
                                <span class="form-help-text">新标签页：点击侧边栏时在新窗口打开；iframe：在右侧内容区内嵌显示</span>
                            </template>
                        </t-form-item>
                    </template>
                    <t-form-item label="导航名称" name="title">
                        <t-input v-model="formData.title" placeholder="请输入导航名称"/>
                    </t-form-item>
                    <t-form-item label="菜单标识" name="name">
                        <t-input v-model="formData.name" placeholder="唯一英文标识，如 dashboard"/>
                    </t-form-item>
                    <t-form-item label="导航图标" name="icon">
                        <div class="icon-field" @click="showIconPicker = true">
                            <t-icon :name="formData.icon || 'file'" class="icon-field__preview"></t-icon>
                            <span class="icon-field__text">[[ formData.icon || '点击选择图标' ]]</span>
                            <t-icon name="chevron-right" class="icon-field__arrow"></t-icon>
                        </div>
                    </t-form-item>
                    <t-form-item label="父级菜单" name="parent_id">
                        <t-select v-model="formData.parent_id" :options="parentOptions" placeholder="顶级菜单"/>
                    </t-form-item>
                    <t-form-item label="是否显示" name="visible">
                        <t-radio-group v-model="formData.visible">
                            <t-radio :value="1">显示</t-radio>
                            <t-radio :value="0">隐藏</t-radio>
                        </t-radio-group>
                    </t-form-item>
                    <div class="nav-editor__actions">
                        <t-button theme="primary" :loading="submitLoading" @click="doSubmit">应用导航</t-button>
                        <t-button v-if="selectedId" theme="danger" variant="text" @click="confirmDelete">删除</t-button>
                    </div>
                </t-form>
            </div>
        </div>
    </t-card>

    <!-- 图标选择器弹窗 -->
    <t-dialog v-model:visible="showIconPicker" header="选择图标" :footer="false" width="720px" placement="center">
        <div class="icon-picker">
            <t-input v-model="iconSearchText" placeholder="搜索图标..." clearable class="mb16">
                <template #prefixIcon><t-icon name="search"></t-icon></template>
            </t-input>
            <div class="icon-picker__grid">
                <div v-for="name in filteredIcons" :key="name" 
                     class="icon-picker__item"
                     :class="{ 'is-selected': formData.icon === name }"
                     @click="formData.icon = name; showIconPicker = false"
                     :title="name">
                    <t-icon :name="name" size="20px"></t-icon>
                </div>
            </div>
            <div v-if="filteredIcons.length === 0" class="icon-picker__empty">未找到匹配的图标</div>
        </div>
    </t-dialog>

</div>
{% endblock %}
{% block scripts %}
<script>
// 从 TDesign Icon Vue Next manifest 动态获取所有可用图标（约 1200+ 个）
// 使用 var 而非 const，避免 SPA 导航重复执行脚本时触发 redeclaration 错误
var TDESIGN_ICONS = (window.TDesignIconVueNext && window.TDesignIconVueNext.manifest)
    ? window.TDesignIconVueNext.manifest.map(function(item) { return item.stem; })
    : ['home', 'dashboard', 'setting', 'user', 'app', 'file', 'folder', 'search', 'check', 'close'];
</script>
<!-- 拖拽子模块须先于 navigation.js 加载（提供 window.HuiYanNavDrag） -->
<script src="/static/js/pages/navigation-drag.js?v={{ config.app_version }}"></script>
<script src="/static/js/pages/navigation.js?v={{ config.app_version }}"></script>
{% endblock %}
