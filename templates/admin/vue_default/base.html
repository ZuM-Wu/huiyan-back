<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}慧眼护农{% endblock %}</title>
    <link rel="icon" href="{{ brand_config.site_favicon }}" type="image/png">
    <script>window.__HUIYAN_BRAND_CONFIG__ = {{ brand_config | tojson }};</script>
    <!-- 防未编译内容闪烁（FOUC）：Vue 挂载前隐藏带 v-cloak 的元素 -->
    <style>[v-cloak]{display:none!important;}</style>
    <!-- 主题防闪烁：页面加载前从 localStorage 读取主题偏好，写入 <html data-theme> 属性 -->
    <script>(function(){try{var t=localStorage.getItem('admin_theme');if(t==='dark'){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}})();</script>
    <!-- TDesign Vue Next CSS（本地 vendor，无外网依赖） -->
    <link rel="stylesheet" href="/static/vendor/tdesign/tdesign.min.css">
    <!-- Design Token（统一令牌，合并深色侧栏 + 浅色内容） -->
    <link rel="stylesheet" href="/static/css/theme.css?v={{ config.app_version }}">
    <!-- 后台样式（由 admin.css 等价拆分为 4 个文件，按原顺序依次引入） -->
    <link rel="stylesheet" href="/static/css/admin-base.css?v={{ config.app_version }}">
    <!-- 内容区滚动契约（page-card-scroll / is-page-scroll 兜底，须在 admin-base.css 之后） -->
    <link rel="stylesheet" href="/static/css/admin-scroll.css?v={{ config.app_version }}">
    <link rel="stylesheet" href="/static/css/object-storage-manager.css?v={{ config.app_version }}">
    <link rel="stylesheet" href="/static/css/admin-nav.css?v={{ config.app_version }}">
    <link rel="stylesheet" href="/static/css/admin-forms.css?v={{ config.app_version }}">
    <link rel="stylesheet" href="/static/css/admin-detail.css?v={{ config.app_version }}">
    <link rel="stylesheet" href="/static/css/variable-hint.css?v={{ config.app_version }}">
    <link rel="stylesheet" href="/static/css/hardware-marker.css?v={{ config.app_version }}">
    <!-- Vue 默认主题自带布局与对话样式，不依赖旧主题的 AI Chat CSS -->
    <link rel="stylesheet" href="{{ theme_static }}/vue-default.css?v={{ config.app_version }}">
    {% block head %}{% endblock %}
</head>
<body class="vue-default-theme">
<div id="app-layout" class="vue-default-layout">
    <!-- 侧边栏 -->
    {% include 'sidebar.html' %}

    <!-- 右侧区域 -->
    <div class="main-area">
        <!-- 顶部栏 -->
        {% include 'topbar.html' %}

        <!-- 页面内容 -->
        <main class="page-content">
            {% block content %}{% endblock %}
        </main>
    </div>
</div>

<!-- ========== 前端依赖（全部本地 vendor，零构建，无海外 CDN） ========== -->
<!-- Vue 3 -->
<script src="/static/vendor/vue/vue.global.prod.min.js"></script>
<!-- TDesign Vue Next -->
<script src="/static/vendor/tdesign/tdesign.min.js"></script>
<!-- TDesign Icons（本地图标集，避免 t-icon 走在线 iconfont） -->
<script src="/static/vendor/tdesign-icons/index.min.js"></script>
<!-- Axios -->
<script src="/static/vendor/axios/axios.min.js"></script>
<!-- ========== 项目公共脚本 ========== -->
<!-- API 请求封装 -->
<script src="/static/js/request.js?v={{ config.app_version }}"></script>
<!-- 共享引导脚本（统一 Vue 应用初始化：delimiters + TDesign + v-permission + 挂载） -->
<script src="/static/js/hy-app.js?v={{ config.app_version }}"></script>
<script src="/static/js/upload-limits.js?v={{ config.app_version }}"></script>
<script data-theme-global src="/static/js/components/storage-migration.js?v={{ config.app_version }}"></script>
<!-- 全局可复用组件（由 hy-app.js 统一注册，须在页面脚本/layout 之前加载） -->
<script data-theme-global src="{{ theme_static }}/js/image-upload.js?v={{ config.app_version }}"></script>
<script data-theme-global src="/static/js/components/object-storage-manager.js?v={{ config.app_version }}"></script>
<!-- 地图共享调色板（canvas 绘制豁免），须先于三个 amap 组件加载 -->
<script data-theme-global src="{{ theme_static }}/js/amap-palette.js?v={{ config.app_version }}"></script>
<script data-theme-global src="/static/js/components/hardware-marker.js?v={{ config.app_version }}"></script>
<script data-theme-global src="{{ theme_static }}/js/amap-picker.js?v={{ config.app_version }}"></script>
<script data-theme-global src="{{ theme_static }}/js/amap-board.js?v={{ config.app_version }}"></script>
<script data-theme-global src="{{ theme_static }}/js/amap-thumb.js?v={{ config.app_version }}"></script>
<script data-theme-global src="{{ theme_static }}/js/com-tinymce.js?v={{ config.app_version }}"></script>
<script data-theme-global src="{{ theme_static }}/js/inbox-rich-content.js?v={{ config.app_version }}"></script>
<script data-theme-global src="{{ theme_static }}/js/upload-settings-panel.js?v={{ config.app_version }}"></script>
<script data-theme-global src="{{ theme_static }}/js/variable-hint.js?v={{ config.app_version }}"></script>
<script data-theme-global src="{{ theme_static }}/js/weather-chart.js?v={{ config.app_version }}"></script>
<!-- AI 对话组件由新主题自带；AI 对话页按需加载本地 TDesign Chat -->
<!-- 布局脚本（侧边栏 + 顶栏） -->
<script src="/static/js/layout.js?v={{ config.app_version }}"></script>
<!-- 矮窗口滚动兜底（按实际裁剪自适应切换整页滚动，详见前端共享能力登记） -->
<script src="/static/js/page-scroll.js?v={{ config.app_version }}"></script>
<!-- SPA 局部加载器（侧边栏不动，只替换内容区） -->
<script src="/static/js/spa-navigator.js?v={{ config.app_version }}"></script>
<!-- 页面专属脚本 -->
{% block scripts %}{% endblock %}
</body>
</html>
