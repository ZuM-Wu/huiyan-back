{% extends "base.html" %}
{% block title %}邮件通知 - 慧眼护农{% endblock %}
{% block head %}
<style>
.template-name-link {
    color: var(--app-text-primary);
    text-decoration: none;
    cursor: pointer;
}
.template-name-link:hover {
    color: var(--app-brand-color);
    text-decoration: underline;
}
</style>
{% endblock %}
{% block content %}
<div id="page-app" v-cloak class="admin-list-page">
    <t-card title="邮件通知">
        <t-tabs v-model="activeTab" theme="normal">
            <!-- ==================== Tab1: 接口列表 ==================== -->
            <t-tab-panel value="interfaces" label="接口列表">
                <t-skeleton v-if="pluginLoading" :row-col="[4]" animation="gradient"></t-skeleton>
            <t-table v-else :data="pluginList" :columns="pluginColumns"
                    row-key="name" hover>
                    <template #status="{ row }">
                        <t-tag v-if="row.orphan" theme="danger" variant="light">文件丢失</t-tag>
                        <t-tag v-else-if="!row.installed" theme="default" variant="light">未安装</t-tag>
                        <t-tag v-else-if="row.status === 1" theme="success" variant="light">已启用</t-tag>
                        <t-tag v-else-if="row.status === 2" theme="danger" variant="light">已禁用</t-tag>
                        <t-tag v-else theme="default" variant="light">已安装</t-tag>
                    </template>
                    <template #operation="{ row }">
                        <template v-if="row.orphan">
                            <t-button theme="danger" variant="text" size="small" @click="uninstallPlugin(row)">卸载清理</t-button>
                        </template>
                        <template v-else-if="!row.installed">
                            <t-button theme="primary" variant="text" size="small" @click="installPlugin(row)">安装</t-button>
                        </template>
                        <template v-else>
                            <t-button theme="default" variant="text" size="small" @click="openConfig(row)">配置</t-button>
                            <t-button theme="default" variant="text" size="small" @click="testPlugin(row)">测试</t-button>
                            <t-button v-if="row.status !== 1" theme="primary" variant="text" size="small" @click="togglePlugin(row, 1)">启用</t-button>
                            <t-button v-if="row.status === 1" theme="warning" variant="text" size="small" @click="togglePlugin(row, 2)">禁用</t-button>
                            <t-button theme="danger" variant="text" size="small" @click="uninstallPlugin(row)">卸载</t-button>
                        </template>
                    </template>
                </t-table>
            </t-tab-panel>

            <!-- ==================== Tab2: 模板管理 ==================== -->
            <t-tab-panel value="templates" label="模板管理">
                <div class="card-header-toolbar">
                    <div class="card-header-toolbar-left">
                        <t-button theme="primary" @click="goCreate">新建模板</t-button>
                    </div>
                    <div class="card-header-toolbar-right">
                        <t-input v-model="tplSearchKeyword" placeholder="搜索模板" clearable style="width: 200px;" @enter="fetchTemplates"></t-input>
                        <t-button theme="primary" @click="fetchTemplates">查询</t-button>
                    </div>
                </div>
                <t-skeleton v-if="templateLoading" :row-col="[6]" animation="gradient"></t-skeleton>
            <t-table v-else :data="templateList" :columns="templateColumns"
                    :pagination="templatePagination" row-key="id" hover @page-change="onTplPageChange">
                    <template #name="{ row }">
                        <a class="template-name-link" href="#" @click.prevent="goEdit(row)">[[ row.name ]]</a>
                    </template>
                    <template #operation="{ row }">
                        <t-button theme="primary" variant="text" size="small" @click="goEdit(row)">编辑</t-button>
                        <t-button theme="default" variant="text" size="small" @click="testSend(row)">测试</t-button>
                        <t-button theme="danger" variant="text" size="small" @click="deleteTemplate(row)">删除</t-button>
                    </template>
                </t-table>
            </t-tab-panel>
        </t-tabs>
    </t-card>

    <!-- 配置弹窗 -->
    <t-dialog v-model:visible="configVisible" :header="configPluginTitle + ' - 配置'" :footer="false" width="720px">
        <t-form v-if="configVisible" :data="configForm" :rules="configRules" label-width="120px" @submit="saveConfig">
            <t-form-item v-for="field in configSchema" :key="field.key" :label="field.label" :name="field.key">
                <t-input v-if="field.type === 'password'" v-model="configForm[field.key]"
                    :placeholder="field.placeholder || ''" type="password"></t-input>
                <t-select v-else-if="field.type === 'select'" v-model="configForm[field.key]"
                    :placeholder="field.placeholder || '请选择'">
                    <t-option v-for="opt in field.options" :key="opt.value" :value="opt.value" :label="opt.label"></t-option>
                </t-select>
                <t-input v-else v-model="configForm[field.key]" :placeholder="field.placeholder || ''"></t-input>
            </t-form-item>
            <div style="display:flex;gap:var(--app-spacing-sm);justify-content:flex-end;margin-top:var(--app-spacing-md);">
                <t-button theme="primary" type="submit" :loading="configSaving">保存</t-button>
                <t-button theme="default" @click="configVisible = false">取消</t-button>
            </div>
        </t-form>
    </t-dialog>

    <!-- 测试发送弹窗 -->
    <t-dialog v-model:visible="testDialogVisible" header="测试发送" :footer="false" width="480px">
        <t-form v-if="testDialogVisible" :data="testForm" label-width="100px" @submit="doTestSend">
            <t-form-item label="模板">
                <span>[[ testTemplate ? testTemplate.name : '' ]]</span>
            </t-form-item>
            <t-form-item label="邮箱">
                <t-input v-model="testForm.email" placeholder="输入测试邮箱地址"></t-input>
            </t-form-item>
            <t-form-item v-for="v in testVariables" :key="v" :label="v">
                <t-input v-model="testForm.vars[v]" :placeholder="'输入 ' + v + ' 的值'"></t-input>
            </t-form-item>
            <div style="display:flex;gap:var(--app-spacing-sm);justify-content:flex-end;margin-top:var(--app-spacing-md);">
                <t-button theme="primary" type="submit" :loading="testSending">发送</t-button>
                <t-button theme="default" @click="testDialogVisible = false">取消</t-button>
            </div>
        </t-form>
    </t-dialog>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/pages/notice-email.js?v={{ config.app_version }}"></script>
{% endblock %}
