{% extends "base.html" %}
{% block title %}应用管理 - 慧眼护农{% endblock %}
{% block head %}
<link rel="stylesheet" href="/static/css/system-settings.css?v={{ config.app_version }}">
{% endblock %}
{% block content %}
<div id="page-app" v-cloak class="plugin-page">
    <t-card title="应用管理">
        <template #header>
            <div class="plugin-toolbar-wrap">
                <div class="card-header-toolbar">
                    <div class="card-header-toolbar-left">
                        <t-button theme="primary" disabled>更多应用</t-button>
                        <t-button theme="default" :loading="syncLoading" @click="openSyncDialog">
                            <template #icon><t-icon name="refresh"></t-icon></template>
                            同步应用
                        </t-button>
                    </div>
                    <div class="card-header-toolbar-right">
                    </div>
                </div>
                <div class="card-header-toolbar">
                    <div class="card-header-toolbar-left">
                        <t-input v-model="searchKeyword" placeholder="请输入应用名称/开发者" clearable
                            class="search-input" @change="applyView" @enter="applyView"></t-input>
                        <t-select v-model="statusFilter" placeholder="请选择状态" clearable
                            class="filter-select" @change="applyView">
                            <t-option value="1" label="启用"></t-option>
                            <t-option value="0" label="停用"></t-option>
                            <t-option value="uninstalled" label="未安装"></t-option>
                        </t-select>
                        <t-button theme="primary" @click="applyView">查询</t-button>
                        <t-button theme="default" variant="outline" @click="resetFilter">重置</t-button>
                    </div>
                </div>
            </div>
        </template>
        <t-skeleton v-if="loading" :row-col="[6]" animation="gradient"></t-skeleton>
        <t-table v-else :data="tableData" :columns="columns"
            :pagination="pagination" row-key="name" hover
            @page-change="onPageChange"
            class="plugin-table">
            <template #status="{ row }">
                <t-tag v-if="row.installed === false" theme="default" variant="light">未安装</t-tag>
                <t-tag v-else-if="row.status === 1" theme="primary" variant="light">启用</t-tag>
                <t-tag v-else theme="default" variant="light">停用</t-tag>
            </template>
            <template #version="{ row }">
                <span>[[ row.installed_version || row.version || '-' ]]</span>
                <t-tag v-if="row.version_state === 'awaiting_restart'" theme="warning" variant="light">
                    待重启生效至 [[ row.pending_update.target_version ]]
                </t-tag>
            </template>
            <template #actions="{ row }">
                <t-space v-if="row.installed === false">
                    <t-button theme="primary" variant="text"
                        :loading="installingName === row.name" @click="doInstall(row)">安装</t-button>
                </t-space>
                <t-space v-else>
                    <t-tooltip v-if="row.version_state === 'awaiting_restart'"
                        :content="controlCenterAvailable ? '在本地控制中心停机应用更新' : '请先启动桌面的慧眼本地控制中心'">
                        <t-button theme="warning" variant="text"
                            @click="openControlCenter(row)">打开控制中心</t-button>
                    </t-tooltip>
                    <t-tooltip v-if="row.upgrade_available" :content="'更新至 ' + row.available_version">
                        <t-button theme="primary" variant="text"
                            :loading="upgradingName === row.name" @click="doUpgrade(row)">更新</t-button>
                    </t-tooltip>
                    <t-button theme="default" variant="text"
                        @click="openConfig(row)">配置</t-button>
                    <t-button v-if="row.status !== 1" theme="primary" variant="text"
                        @click="togglePlugin(row, 1)">启用</t-button>
                    <t-button v-if="row.status === 1" theme="default" variant="text"
                        @click="togglePlugin(row, 0)">停用</t-button>
                    <t-button theme="danger" variant="text"
                        @click="confirmUninstall(row)">卸载</t-button>
                </t-space>
            </template>
        </t-table>
    </t-card>

    <t-dialog v-model:visible="syncVisible" header="同步应用" :footer="false" width="min(920px, 94vw)">
        <t-skeleton v-if="syncLoading" :row-col="[6]" animation="gradient"></t-skeleton>
        <t-table v-else :data="syncRows" :columns="syncColumns" row-key="name" hover
            max-height="560px" class="plugin-sync-table">
            <template #installed_version="{ row }">[[ row.installed_version || '-' ]]</template>
            <template #status="{ row }">
                <t-tag v-if="!row.installed" theme="default" variant="light">未安装</t-tag>
                <t-tag v-else-if="row.status === 1" theme="primary" variant="light">启用</t-tag>
                <t-tag v-else theme="default" variant="light">停用</t-tag>
            </template>
            <template #version_state="{ row }">
                <t-tag v-if="row.version_state === 'awaiting_restart'" theme="warning" variant="light">
                    待重启生效至 [[ row.pending_update.target_version ]]
                </t-tag>
                <t-tag v-else :theme="versionStateTheme(row.version_state)" variant="light">
                    [[ versionStateLabel(row.version_state) ]]
                </t-tag>
            </template>
            <template #sync_actions="{ row }">
                <t-space v-if="row.version_state === 'awaiting_restart' || row.upgrade_available">
                    <t-button v-if="row.version_state === 'awaiting_restart'" theme="warning"
                        variant="text" @click="openControlCenter(row)">控制中心</t-button>
                    <t-button v-if="row.upgrade_available" theme="primary" variant="text"
                        :loading="upgradingName === row.name" @click="upgradeFromSync(row)">更新</t-button>
                </t-space>
                <span v-else>-</span>
            </template>
        </t-table>
    </t-dialog>

    <t-dialog v-model:visible="configVisible"
        :header="(configPlugin ? configPlugin.title : '') + '配置'" width="620px"
        :confirm-btn="configSchema.length ? { content: '保存', loading: configSaving } : null"
        @confirm="saveConfig">
        <t-skeleton v-if="configLoading" :row-col="[4]" animation="gradient"></t-skeleton>
        <template v-else>
            <t-form v-if="configSchema.length" :data="configForm" label-align="top">
                <t-form-item v-for="field in configSchema" :key="field.key" :label="field.label">
                    <t-select v-if="field.type === 'select'" v-model="configForm[field.key]"
                        :options="field.options || []" :placeholder="field.placeholder || ''"></t-select>
                    <t-switch v-else-if="field.type === 'switch'" v-model="configForm[field.key]"></t-switch>
                    <t-input v-else v-model="configForm[field.key]"
                        :type="field.type === 'password' ? 'password' : 'text'"
                        :placeholder="field.placeholder || ''"></t-input>
                    <div v-if="field.help" class="upload-policy-desc">[[ field.help ]]</div>
                </t-form-item>
            </t-form>
            <div v-if="uploadPolicies.length" class="plugin-upload-policy">
                <div class="form-section-title">上传规则</div>
                <div v-for="policy in uploadPolicies" :key="policy.id" class="plugin-upload-policy__row">
                    <strong>[[ policy.label ]]</strong>
                    <span>[[ policy.max_size_mb ]] MB</span>
                    <span>[[ policy.extensions.join(' / ') ]]</span>
                </div>
                <t-button theme="primary" variant="text" @click="goUploadSettings">
                    前往上传设置
                    <template #icon><t-icon name="chevron-right"></t-icon></template>
                </t-button>
            </div>
            <t-empty v-if="!configSchema.length && !uploadPolicies.length" description="该插件暂无配置"></t-empty>
        </template>
    </t-dialog>

</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/pages/plugin.js?v={{ config.app_version }}"></script>
{% endblock %}
