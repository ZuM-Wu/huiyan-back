{% extends "base.html" %}
{% block title %}系统日志 - 慧眼护农{% endblock %}
{% block content %}
<div id="page-app" v-cloak class="admin-list-page system-log-page">
    <t-card title="系统日志">
        <t-tabs v-model="activeTab" placement="left" @change="onTabChange">
            <t-tab-panel v-for="tab in tabList" :key="tab.value" :value="tab.value" :label="tab.label">
                <div class="card-header-toolbar">
                    <div class="card-header-toolbar-right" style="width:100%; display:flex; gap:8px;">
                        <t-input v-model="searchKeyword" placeholder="搜索描述..." clearable style="width: 240px;" @change="fetchData"/>
                        <table-column-visibility table-key="admin.system-log" :columns="columns"></table-column-visibility>
                    </div>
                </div>
                <t-skeleton v-if="loading" :row-col="[6]" animation="gradient"></t-skeleton>
                <t-table v-else :data="tableData" :columns="$HuiYanTableColumns.getVisible('admin.system-log', columns)" :pagination="pagination"
                    row-key="id" hover @page-change="onPageChange">
                    <template #type="{ row }">
                        <t-tag variant="light">[[ row.type ]]</t-tag>
                    </template>
                </t-table>
            </t-tab-panel>
        </t-tabs>
    </t-card>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/pages/log.js?v={{ config.app_version }}"></script>
{% endblock %}
