{% extends "base.html" %}
{% block title %}管理员管理 - 慧眼护农{% endblock %}
{% block content %}
<div id="page-app" v-cloak class="admin-list-page">

    <!-- 管理员列表 / 角色管理 两 Tab（卡片包裹 tabs，统一圆角） -->
    <t-card title="管理员管理">
        <t-tabs v-model="activeTab" theme="normal">
            <!-- ========== Tab 1: 管理员列表 ========== -->
            <t-tab-panel value="admin" label="管理员列表">
                <div class="card-header-toolbar">
                    <div class="card-header-toolbar-left">
                        <t-button v-permission="'admin:create'" theme="primary" @click="openCreate">新增管理员</t-button>
                    </div>
                    <div class="card-header-toolbar-right">
                        <t-input v-model="searchKeyword" placeholder="搜索用户名..." clearable class="search-input" @change="fetchData"/>
                    </div>
                </div>
                <t-skeleton v-if="loading" :row-col="[6]" animation="gradient"></t-skeleton>
                <t-table v-else :data="tableData" :columns="columns" :pagination="pagination"
                    row-key="id" hover @page-change="onPageChange">
                    <template #status="{ row }">
                        <t-tag :theme="row.status === 1 ? 'success' : 'danger'" variant="light">
                            [[ row.status === 1 ? '正常' : '禁用' ]]
                        </t-tag>
                    </template>
                    <template #actions="{ row }">
                        <t-space>
                            <t-button v-permission="'admin:update'" theme="primary" variant="text" size="small" @click="openEdit(row)">编辑</t-button>
                            <t-button v-permission="'admin:status'" :theme="row.status === 1 ? 'warning' : 'success'"
                                variant="text" size="small" @click="toggleStatus(row)">
                                [[ row.status === 1 ? '禁用' : '启用' ]]
                            </t-button>
                            <t-button v-permission="'admin:delete'" theme="danger" variant="text" size="small" @click="confirmDelete(row)">删除</t-button>
                        </t-space>
                    </template>
                </t-table>
            </t-tab-panel>

            <!-- ========== Tab 2: 角色管理 ========== -->
            <t-tab-panel value="role" label="角色管理">
                <div class="card-header-toolbar">
                    <div class="card-header-toolbar-left">
                        <t-button v-permission="'role:create'" theme="primary" @click="openRoleCreate">新增角色</t-button>
                    </div>
                    <div class="card-header-toolbar-right">
                    </div>
                </div>
                <t-skeleton v-if="roleLoading" :row-col="[4]" animation="gradient"></t-skeleton>
                <t-table v-else :data="roleData" :columns="roleColumns" row-key="id" hover>
                    <template #is_system="{ row }">
                        <t-tag :theme="row.is_system === 1 ? 'primary' : 'default'" variant="light">
                            [[ row.is_system === 1 ? '系统' : '自定义' ]]
                        </t-tag>
                    </template>
                    <template #actions="{ row }">
                        <t-space>
                            <t-button v-permission="'role:update'" theme="primary" variant="text" size="small" @click="openRoleEdit(row)">编辑</t-button>
                            <t-button v-if="row.is_system !== 1" v-permission="'role:delete'" theme="danger" variant="text" size="small" @click="confirmRoleDelete(row)">删除</t-button>
                        </t-space>
                    </template>
                </t-table>
            </t-tab-panel>
        </t-tabs>
    </t-card>

    <!-- 管理员 新增/编辑弹窗 -->
    <t-dialog v-model:visible="dialogVisible" :header="isEdit ? '编辑管理员' : '新增管理员'"
        :confirm-btn="{content:'保存',theme:'primary',loading:submitLoading}"
        :cancel-btn="{content:'取消'}" @confirm="doSubmit" @close="resetForm" @closed="() => submitLoading = false">
        <t-form ref="formRef" :data="formData" :rules="formRules">
            <t-form-item label="用户名" name="username">
                <t-input v-model="formData.username" placeholder="请输入用户名" :disabled="isEdit"/>
            </t-form-item>
            <t-form-item label="密码" :name="!isEdit ? 'password' : ''">
                <t-input v-model="formData.password" type="password" :placeholder="isEdit ? '留空则不修改' : '请输入密码'"/>
            </t-form-item>
            <t-form-item label="昵称" name="nickname">
                <t-input v-model="formData.nickname" placeholder="请输入昵称"/>
            </t-form-item>
            <t-form-item label="邮箱">
                <t-input v-model="formData.email" placeholder="请输入邮箱"/>
            </t-form-item>
            <t-form-item label="所属角色" name="role_id">
                <t-select v-model="formData.role_id" :options="roleOptions" placeholder="请选择角色"/>
            </t-form-item>
        </t-form>
    </t-dialog>

    <!-- 角色 新增/编辑弹窗 -->
    <t-dialog v-model:visible="roleDialogVisible" :header="roleIsEdit ? '编辑角色' : '新增角色'"
        :confirm-btn="{content:'保存',theme:'primary',loading:roleSubmitLoading}"
        :cancel-btn="{content:'取消'}" @confirm="doRoleSubmit" @close="resetRoleForm" :width="560">
        <t-form ref="roleFormRef" :data="roleForm" :rules="roleRules">
            <t-form-item label="角色名称" name="name">
                <t-input v-model="roleForm.name" placeholder="请输入角色名称"/>
            </t-form-item>
            <t-form-item label="描述">
                <t-textarea v-model="roleForm.description" placeholder="请输入角色描述"/>
            </t-form-item>
            <t-form-item label="功能权限">
                <!-- 用单个全宽容器包裹，避免 t-form 控件区 flex 布局把控件行/提示/目录树挤在同一行 -->
                <div class="perm-field">
                    <!-- 权限操作工具条：切换按钮居左（中性次要样式），搜索框靠右，间距取 --app-spacing-sm=8px -->
                    <div class="perm-toolbar">
                        <t-button theme="default" @click="toggleExpand">
                            [[ expandAll ? '折叠' : '展开' ]]
                        </t-button>
                        <t-button theme="default" @click="toggleCheckAll">
                            [[ checkAll ? '全不选' : '全选' ]]
                        </t-button>
                        <t-input v-model="treeFilter" placeholder="搜索权限..."
                            clearable class="perm-toolbar__search" @change="onTreeFilter"/>
                    </div>
                    <!-- 注意：这是 Jinja/HTML 模板，自定义元素不支持自闭合写法，
                         必须显式写 </t-alert>，否则后面的目录树会被浏览器解析为 alert 的子节点（被橙色提示框包住） -->
                    <t-alert theme="warning" message="需重新登录管理员后权限才生效" :close="true"
                        class="mb8"></t-alert>
                    <div class="perm-tree-wrapper">
                        <t-tree :data="permTreeData" :keys="{ value: 'id', label: 'title', children: 'children' }"
                            v-model="roleForm.auth" :checkable="true"
                            :expanded="expandedKeys" @expand="onExpand" :indeterminate="true"
                            value-mode="all" :line="true"
                            :allow-fold-node-on-filter="true"
                            :filter="filterTreeNode"
                            :disabled="roleIsEdit && roleEditId === 1"
                            ref="treeRef"/>
                    </div>
                </div>
            </t-form-item>
        </t-form>
    </t-dialog>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/pages/user.js?v={{ config.app_version }}"></script>
{% endblock %}
