{% extends "base.html" %}
{% block title %}产区管理 - 慧眼护农{% endblock %}
{% block head %}
<style>
/* 产区管理页面专属样式 */
.pa-map-config { max-width: 640px; padding: var(--app-spacing-lg) 0; }
.pa-map-config .t-form__item { margin-bottom: var(--app-spacing-lg); }
.pa-map-config .t-form__item:last-child { margin-bottom: 0; }
.pa-map-config .t-form__controls-content { flex-wrap: wrap; }
.pa-map-config .form-help-text { flex-basis: 100%; margin-top: var(--app-spacing-xs); }
.pa-geo-tabs { margin-top: var(--app-spacing-sm); }
.pa-manual-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: var(--app-spacing-sm);
    width: 100%;
}
.pa-manual-grid .t-form__item { margin-bottom: 0; }
@media (max-width: 720px) {
    .pa-manual-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 480px) {
    .pa-manual-grid { grid-template-columns: minmax(0, 1fr); }
}
.amap-picker__toolbar {
    display: flex;
    align-items: center;
    gap: var(--app-spacing-sm);
    /* 上下均留间距：与上方 Tab 栏、下方地图容器隔开 */
    margin: var(--app-spacing-sm) 0;
    flex-wrap: wrap;
}
.amap-picker__map {
    width: 100%;
    height: 560px;
    border: 1px solid var(--app-border);
    border-radius: var(--app-radius-md, 6px);
    background: var(--app-bg-container, #f5f5f5);
}
.amap-picker__hint,
.amap-picker__tip {
    margin-top: var(--app-spacing-xs);
    font-size: 12px;
    color: var(--app-text-secondary);
}
.amap-picker__tip {
    padding: var(--app-spacing-md);
    background: var(--app-bg-container, #f5f5f5);
    border-radius: var(--app-radius-md, 6px);
}
</style>
{% endblock %}
{% block content %}
<div id="page-app" v-cloak class="admin-list-page production-area-page">
    <t-card title="产区管理">
        <t-tabs v-model="activeTab" theme="normal">

            <!-- ========== Tab 1: 产区列表 ========== -->
            <t-tab-panel value="list" label="产区列表">
                <div class="card-header-toolbar">
                    <div class="card-header-toolbar-left">
                        <t-input v-model="searchKeyword" placeholder="产区名称、编号、农户" clearable class="search-input" @enter="fetchAreas"></t-input>
                        <t-button theme="primary" @click="fetchAreas">查询</t-button>
                        <t-button theme="primary" v-permission="'area:create'" @click="openCreate">新增产区</t-button>
                        <table-column-visibility table-key="admin.production-areas" :columns="areaColumns"></table-column-visibility>
                    </div>
                </div>
                <t-skeleton v-if="areaLoading" :row-col="[6]" animation="gradient"></t-skeleton>
                <t-table v-else :data="areaList" :columns="$HuiYanTableColumns.getVisible('admin.production-areas', areaColumns)"
                    :pagination="areaPagination" row-key="id" hover @page-change="onAreaPageChange">
                    <template #status="{ row }">
                        <t-tag v-if="row.status === 1" theme="success" variant="light">正常</t-tag>
                        <t-tag v-else theme="default" variant="light">停用</t-tag>
                    </template>
                    <template #farmer_count="{ row }">
                        <t-tag v-if="row.farmer_count" theme="success" variant="light">[[ row.farmer_count ]] 户</t-tag>
                        <t-tag v-else theme="default" variant="light">未绑定</t-tag>
                    </template>
                    <template #operation="{ row }">
                        <t-button theme="primary" variant="text" v-permission="'area:update'" @click="openEdit(row)">编辑</t-button>
                        <t-button theme="default" variant="text" @click="goPlots(row)">管理地块</t-button>
                        <t-button theme="primary" variant="text" @click="goManagement">产区管理</t-button>
                        <t-button :theme="row.status === 1 ? 'warning' : 'success'" variant="text" v-permission="'area:status'" @click="toggleStatus(row)">
                            [[ row.status === 1 ? '停用' : '启用' ]]
                        </t-button>
                        <t-button theme="danger" variant="text" v-permission="'area:delete'" @click="removeArea(row)">删除</t-button>
                    </template>
                </t-table>
            </t-tab-panel>

            <!-- ========== Tab 2: 地图设置 ========== -->
            <t-tab-panel value="map" label="地图设置" v-permission="'area:map_config'">
                <t-form :data="mapForm" label-width="160px" class="pa-map-config">
                    <t-form-item label="高德 Web JS API Key">
                        <t-input v-model="mapForm.amap_web_key" placeholder="请输入高德 Web 端 Key"></t-input>
                    </t-form-item>
                    <t-form-item label="高德安全密钥 jscode">
                        <t-input v-model="mapForm.amap_js_security_code" placeholder="请输入安全密钥 jscode"></t-input>
                    </t-form-item>
                    <t-form-item label="高德 Web 服务 Key">
                        <t-input v-model="mapForm.amap_web_service_key" placeholder="请输入高德 Web 服务 Key（绑定页缩略图/静态地图用）"></t-input>
                        <div class="form-help-text">与 JS API Key 不同，需在高德控制台单独创建「Web 服务」类型 Key</div>
                    </t-form-item>
                    <t-form-item label="地图选址开关">
                        <t-radio-group v-model="mapForm.production_area_map_enabled">
                            <t-radio-button value="1">开启</t-radio-button>
                            <t-radio-button value="0">关闭</t-radio-button>
                        </t-radio-group>
                        <div class="form-help-text">关闭后编辑弹窗仅保留「手动填写」</div>
                    </t-form-item>
                    <t-form-item>
                        <t-button theme="primary" :loading="mapSaving" @click="saveMapConfig">保存</t-button>
                    </t-form-item>
                </t-form>
            </t-tab-panel>

        </t-tabs>
    </t-card>

    <!-- 产区编辑弹窗 -->
    <t-dialog v-model:visible="dialogVisible" :header="dialogTitle" width="1040px"
        :confirm-btn="{content:'保存',theme:'primary',loading:saving}"
        :cancel-btn="{content:'取消'}" @confirm="doSave" @opened="onDialogOpened">
        <!-- 视觉规范 9.9：必填校验用 Form rules 内联提示（显示在输入框下方），禁止 MessagePlugin 弹出 -->
        <t-form ref="formRef" :data="form" :rules="rules" label-width="100px">
            <!-- 基础信息：一行 4 列（TDesign 12 栏格，span=3），减少上方高度占用 -->
            <t-row :gutter="16">
                <t-col :span="3">
                    <t-form-item label="产区名称" name="name">
                        <t-input v-model="form.name" placeholder="请输入产区名称"></t-input>
                    </t-form-item>
                </t-col>
                <t-col :span="3">
                    <t-form-item label="产区编号">
                        <t-input v-model="form.code" placeholder="选填"></t-input>
                    </t-form-item>
                </t-col>
                <t-col :span="3">
                    <t-form-item label="主要作物">
                        <t-input v-model="form.crop_category" placeholder="选填，如 水稻/柑橘"></t-input>
                    </t-form-item>
                </t-col>
                <t-col :span="3">
                    <t-form-item label="面积(亩)">
                        <t-input-number v-model="form.area_size" :min="0" theme="normal" style="width:100%"></t-input-number>
                    </t-form-item>
                </t-col>
            </t-row>

            <!-- 选址：内嵌 Tab（地图框选 / 手动填写）双向同步 -->
            <t-form-item label="选址">
                <t-tabs v-model="geoTab" theme="normal" class="pa-geo-tabs" style="width:100%" :key="geoTabsKey">
                    <t-tab-panel v-if="mapEnabled" value="map" label="地图框选">
                        <amap-picker :key="geoKey" :model-value="geoModel" @update:model-value="onGeoUpdate" :api-key="mapKey" :security-code="mapSecurity"></amap-picker>
                    </t-tab-panel>
                    <t-tab-panel value="manual" label="手动填写">
                        <div class="pa-manual-grid">
                            <t-form-item label="省"><t-input v-model="form.province" placeholder="省"></t-input></t-form-item>
                            <t-form-item label="市"><t-input v-model="form.city" placeholder="市"></t-input></t-form-item>
                            <t-form-item label="区/县"><t-input v-model="form.district" placeholder="区/县"></t-input></t-form-item>
                            <t-form-item label="详细地址"><t-input v-model="form.address" placeholder="详细地址"></t-input></t-form-item>
                            <t-form-item label="经度"><t-input v-model.number="form.longitude" placeholder="经度"></t-input></t-form-item>
                            <t-form-item label="纬度"><t-input v-model.number="form.latitude" placeholder="纬度"></t-input></t-form-item>
                        </div>
                    </t-tab-panel>
                </t-tabs>
            </t-form-item>

            <t-form-item label="排序">
                <t-input-number v-model="form.sort_order" :min="0" theme="normal"></t-input-number>
            </t-form-item>
            <t-form-item label="备注">
                <t-textarea v-model="form.description" placeholder="选填" :autosize="{minRows:2,maxRows:4}"></t-textarea>
            </t-form-item>
        </t-form>
    </t-dialog>

</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/pages/production-area.js?v={{ config.app_version }}"></script>
{% endblock %}
