{% extends "base.html" %}
{% block title %}AI 对话 - 慧眼护农{% endblock %}
{% block head %}
<!-- AI 对话页共享样式（工具气泡/消息气泡/markdown 渲染等，全 --app-* 令牌） -->
<link rel="stylesheet" href="/static/css/ai-chat.css?v={{ config.app_version }}">
<link rel="stylesheet" href="/static/css/ai-chat-images.css?v={{ config.app_version }}">
<!-- TDesign Chat 组件库样式（本地 vendor，含 Web Components 基础样式） -->
<link rel="stylesheet" href="/static/vendor/tdesign-chat/tdesign-chat.css?v={{ config.app_version }}">
<style>
/* AI 对话页页面级布局骨架（仅布局，组件样式在 ai-chat.css） */
.ai-chat-page-card { margin-bottom: 0; }
.ai-chat-page-card > .t-card__body { padding: 0; overflow: hidden; }
.ai-chat-shell { display: flex; flex: 1; min-height: 0; background: var(--app-bg-page); }
.ai-chat-sidebar { width: 272px; flex-shrink: 0; display: flex; flex-direction: column; min-height: 0;
    border-right: 1px solid var(--app-border); background: var(--app-bg-card); }
.ai-chat-sidebar__head { padding: var(--app-spacing-md); border-bottom: 1px solid var(--app-border); }
.ai-conv-list { flex: 1; min-height: 0; overflow-y: auto; padding: var(--app-spacing-sm); }
.ai-conv-item { display: flex; align-items: center; gap: var(--app-spacing-xs); padding: 10px 12px;
    border-radius: var(--app-radius-md); cursor: pointer; color: var(--app-text-primary);
    border: 1px solid transparent; transition: background var(--app-duration-fast) var(--app-ease-standard),
    border-color var(--app-duration-fast) var(--app-ease-standard), transform var(--app-duration-base) var(--app-ease-spring); }
.ai-conv-item:hover { background: var(--app-bg-container); transform: translateY(-1px); }
.ai-conv-item.active { background: var(--app-brand-light); color: var(--app-brand-color); border-color: var(--app-brand-focus-ring); }
.ai-conv-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 500; }
.ai-conv-empty { text-align: center; color: var(--app-text-secondary); font-size: 12px; padding: var(--app-spacing-lg) 0; }
.ai-chat-workspace { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; padding: 0; }
.ai-chat-stage { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; position: relative;
    background: var(--app-bg-card); overflow: hidden; }
.ai-chat-main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; position: relative;
    padding: 0 var(--app-spacing-lg) var(--app-spacing-lg); overflow: hidden; }
.ai-model-select { flex: 1 1 180px; min-width: 0; }
.ai-chat-setup-state { display: flex; flex-direction: column; align-items: center; gap: var(--app-spacing-sm);
    color: var(--app-text-secondary); text-align: center; }
.ai-chat-setup-state strong { color: var(--app-text-primary); font-size: 18px; }
@media (max-width: 1200px) {
    .ai-chat-sidebar { width: 240px; }
}
@media (max-width: 900px) {
    .ai-chat-shell { flex-direction: column; }
    .ai-chat-sidebar { width: 100%; max-height: 240px; border-right: none; border-bottom: 1px solid var(--app-border); }
    .ai-chat-workspace { padding: var(--app-spacing-sm); }
}
</style>
{% endblock %}
{% block content %}
<div id="page-app" v-cloak>
    <t-card class="ai-chat-page-card" :bordered="false" title="AI 对话">
        <div class="ai-chat-shell">
            <aside class="ai-chat-sidebar">
                <div class="ai-chat-sidebar__head">
                    <t-button theme="primary" block @click="newConversation">
                        <template #icon><t-icon name="add"></t-icon></template>新对话
                    </t-button>
                </div>
                <div class="ai-conv-list">
                    <div v-for="c in conversations" :key="c.id"
                        :class="['ai-conv-item', { active: c.id === conversationId }]" @click="openConversation(c)">
                        <span class="ai-conv-title">[[ c.title || '未命名会话' ]]</span>
                        <t-button theme="danger" variant="text" size="small" shape="square"
                            @click.stop="removeConversation(c)">
                            <template #icon><t-icon name="delete"></t-icon></template>
                        </t-button>
                    </div>
                    <div v-if="!conversations.length" class="ai-conv-empty">暂无会话，发送消息后将自动创建</div>
                </div>
            </aside>

            <section class="ai-chat-workspace">
                <div class="ai-chat-stage">
                    <div class="ai-chat-main">
                        <div v-if="!chatList.length && !isStreaming" class="ai-chat-welcome">
                            <template v-if="modelReady">
                                <strong>AI 助手</strong>
                                <span>输入问题开始对话，或输入 “/” 选择可用能力</span>
                            </template>
                            <div v-else class="ai-chat-setup-state">
                                <strong>尚未配置可用模型</strong>
                                <span>请先在 AI 设置中启用模型接口并完成必填配置</span>
                                <t-button theme="primary" variant="outline" @click="goAiSettings">
                                    <template #icon><t-icon name="setting"></t-icon></template>
                                    前往 AI 设置
                                </t-button>
                            </div>
                        </div>
                        <!-- 消息列表（TDesign Chat TChat 容器，footer slot 承载发送区） -->
                        <ai-message-list ref="messageListRef" :messages="chatList" :loading="loading">
                            <template #footer>
                                <!-- 技能选择面板（“/” 键入与技能按钮双通道弹出） -->
                                <div v-if="skillPanelVisible" class="ai-skill-panel"
                                    @mousedown.stop @click.stop>
                                    <div v-for="group in skillGroups" :key="group.name" class="ai-skill-group">
                                        <div v-if="group.name !== '内置技能'" class="ai-skill-group-title">[[ group.name ]]</div>
                                        <div v-for="s in group.items" :key="s.id || s.name" class="ai-skill-item"
                                            @click="selectSkill(s)">
                                            <t-icon name="app" class="skill-icon"></t-icon>
                                            <span class="skill-name">[[ s.name ]]</span>
                                            <span v-if="s.description" class="skill-desc">[[ s.description ]]</span>
                                        </div>
                                    </div>
                                    <div v-if="!filteredSkills.length" class="ai-skill-empty">暂无匹配技能</div>
                                </div>

                                <!-- 已选技能标签（可移除，对当前会话生效） -->
                                <div v-if="selectedSkill" class="ai-skill-tag-row">
                                    <t-tag theme="primary" variant="light" closable @close="selectedSkill = null">
                                        技能：[[ selectedSkill.name ]]
                                    </t-tag>
                                </div>

                                <!-- 发送区（TDesign Chat ChatSender，footer-prefix 药丸形工具栏 + suffix 上传按钮） -->
                                <ai-chat-sender v-model="senderValue" v-model:attachments="uploadedImages"
                                    :loading="isStreaming" :disabled="uploadingImages || !modelReady"
                                    placeholder="输入消息，Enter 发送"
                                    @send="onSend" @stop="onStop">
                                    <template #footer-prefix>
                                        <div v-if="modelReady" class="model-select">
                                            <t-select v-model="selectedModel"
                                                placeholder="选择模型" :disabled="isStreaming">
                                                <t-option v-for="m in models" :key="m.name" :value="m.name"
                                                    :label="m.label || m.name"></t-option>
                                            </t-select>
                                            <t-button v-if="skills.length" :class="['check-box', { 'is-active': skillPanelVisible }]"
                                                variant="outline" @click="toggleSkillPanel">
                                                <template #icon><t-icon name="app"></t-icon></template>
                                                <span>技能</span>
                                            </t-button>
                                        </div>
                                        <div v-else class="model-unavailable">
                                            <span>[[ modelMessage ]]</span>
                                            <t-button variant="outline" size="small" @click="goAiSettings">
                                                <template #icon><t-icon name="setting"></t-icon></template>
                                                AI 设置
                                            </t-button>
                                        </div>
                                    </template>
                                    <template #suffix="{ renderPresets }">
                                        <component :is="renderPresets([])" />
                                    </template>
                                </ai-chat-sender>
                            </template>
                        </ai-message-list>
                    </div>
                </div>
            </section>
        </div>
    </t-card>
</div>
{% endblock %}
{% block scripts %}
<!-- TDesign Chat 组件库（IIFE 全局产物，external vue 复用全局 Vue） -->
<script src="/static/vendor/tdesign-chat/tdesign-chat.iife.js?v={{ config.app_version }}"></script>
<!-- markdown 渲染库（IIFE，暴露全局 marked 对象） -->
<script src="/static/vendor/marked/marked.min.js?v={{ config.app_version }}"></script>
<!-- AI 对话共享工具（SSE 解析/消息段模型/事件处理） -->
<script src="/static/js/ai-chat-utils.js?v={{ config.app_version }}"></script>
<!-- AI 对话共享组件已由 base.html 全局加载（ai-*-.js，注册到 HuiYanComponents） -->
<!-- 页面脚本 -->
<script src="/static/js/pages/ai-chat.js?v={{ config.app_version }}"></script>
{% endblock %}
